name: Run RSS Scout

on:
  schedule:
    - cron: '0 0 * * 5' # Еженедельный запуск в полночь с четверга на пятницу (00:00 UTC пятницы)
  workflow_dispatch:

# ВАЖНО: Разрешаем боту перезаписывать файлы в репозитории
permissions:
  contents: write

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser deep-translator

      - name: Запуск Разведчика
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scout.py
            

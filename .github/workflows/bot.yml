name: TerraFuturra News Bot

on:
  schedule:
    - cron: '0 0 * * *' # Ежедневный запуск в 00:00 UTC (полночь)
  workflow_dispatch: # Кнопка для ручного запуска

# ВАЖНО: Разрешаем боту делать git push обратно в репозиторий
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        # Устанавливаем все нужные библиотеки одной командой (requirements.txt больше не нужен)
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 deep-translator pdfplumber

      - name: Запуск скрипта
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        # ВНИМАНИЕ: убедись, что твой файл со скриптом называется именно bot.py
        # Если он называется иначе (например, main.py), поменяй название ниже!
        run: python bot.py
            

name: Run News Bot

on:
  schedule:
    - cron: '1 18 * * *' # Автоматический запуск каждый день в 18:01 UTC
  workflow_dispatch: # Кнопка для ручного запуска

# ВАЖНО: Разрешаем боту делать git push обратно в репозиторий
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка библиотек
        # Устанавливаем все нужные библиотеки одной командой (requirements.txt больше не нужен)
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 deep-translator pdfplumber

      - name: Запуск скрипта
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        # ВНИМАНИЕ: убедись, что твой файл со скриптом называется именно bot.py
        # Если он называется иначе (например, main.py), поменяй название ниже!
        run: python bot.py
      
      - name: Сохранение результатов в GitHub (Commit and Push)
        # Объединили два твоих шага с git push в один для скорости
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add source_links.txt sent_articles.txt
          git commit -m "Автоматическое обновление базы ссылок и истории" || echo "Нет новых изменений"
          git push
